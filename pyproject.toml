[project]
name = "cs180"
version = "0.1.0"
description = "Tooling for CS180 project writeups (image processing + media prep for the site)."
requires-python = ">=3.12"
dependencies = [
    # media prep for the site (0/tools/make_gif.py)
    "pillow>=11",
    "pillow-heif>=0.18",       # iPhone .HEIC support
    # project image processing (1/tools/colorfy.py and later projects)
    "numpy>=2",
    "scikit-image>=0.24",      # note: import name is `skimage`
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
